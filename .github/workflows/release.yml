name: Tag and release

# Creates tag vX.Y.Z and a GitHub Release from VERSION whenever main carries a version that has no release yet.
# Release notes come from docs/releases/vX.Y.Z.md.
on:
  push:
    branches: [main]
    paths: ["VERSION", "docs/releases/**", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create tag and release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v$(tr -d '[:space:]' < VERSION)"
          notes="docs/releases/$v.md"
          [ -f "$notes" ] || { echo "::error::$notes is missing"; exit 1; }
          if gh release view "$v" >/dev/null 2>&1; then
            echo "$v already released"; exit 0
          fi
          gh release create "$v" --target "$GITHUB_SHA" --title "$(head -1 "$notes" | sed 's/^# *//')" --notes-file "$notes"
